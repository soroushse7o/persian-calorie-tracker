<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0C0D" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Pre-paint theme sync: the store persists JSON ("dark" | "light") in localStorage.
      // Apply it before first paint so light-theme users never see a dark flash.
      (function () {
        try {
          var raw = window.localStorage.getItem('kalorishomar_v2_theme')
          var parsed = raw ? JSON.parse(raw) : null
          var theme = parsed === 'light' || raw === '"light"' || raw === 'light' ? 'light' : 'dark'
          var root = document.documentElement
          root.classList.remove('dark', 'light')
          root.classList.add(theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#F4F5F7' : '#0C0C0D')
        } catch (_) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <meta
      name="description"
      content="کالری‌شمار روزمره — ردیاب سریع، کاملاً آفلاین و هوشمند کالری، درشت‌مغذی، آب و وزن برای غذاهای خانگی ایرانی با واحدهای واقعی آشپزخانه."
    />
